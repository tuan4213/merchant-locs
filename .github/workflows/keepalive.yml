name: Keep Streamlit Awake
on:
  schedule:
    - cron: '*/10 * * * *'   # mỗi 10 phút
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health endpoint
        run: |
          URL="https://merchant-locs.streamlit.app/_stcore/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ App awake"
              exit 0
            fi
            sleep 30
          done
          echo "⚠️ App không phản hồi 200 — vẫn coi là ping (có thể đang sleep)"
          exit 0
