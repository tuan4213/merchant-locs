name: Discord Scraper
on:
  schedule:
    - cron: '5,15 3,9,15,21 * * *'  # 04:05/04:15, 10:05/10:15, 16:05/16:15, 22:05/22:15 VN (+07)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --quiet discord.py-self pandas requests PyGithub python-dateutil

      - name: Run scraper
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: |
          python discord_scraper.py

      - name: Verify
        run: |
          echo "data.csv size: $(stat -c%s data.csv) bytes"
          head -n 2 data.csv
